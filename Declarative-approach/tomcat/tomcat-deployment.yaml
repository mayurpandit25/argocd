apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: tomcat-deployment
  labels: 
    app: tomcat
spec: 
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector: 
    matchLabels: 
      app: tomcat
  template: 
    metadata: 
      labels: 
        app: tomcat
    spec: 
      containers:
      - name: tomcat-container
        image: tomcat:latest
        ports:
        - name: tomcat-port
          containerPort: 8080

        resources:
          requests: 
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
            
        
apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: nginx-deployment
  labels: 
    app: nginx
spec: 
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector: 
    matchLabels: 
      app: nginx
  template: 
    metadata: 
      labels: 
        app: nginx
    spec: 
      containers:
      - name: nginx-container
        image: nginx:latest
        ports:
        - name: nginx-port
          containerPort: 80

        resources:
          requests: 
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
            
        

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-child             
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mayurpandit25/argocd.git
    targetRevision: main
    path: GUI-approach/nginx     
  destination:
    server: https://kubernetes.default.svc
    namespace: default          
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
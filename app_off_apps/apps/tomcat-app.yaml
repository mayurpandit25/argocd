apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tomcat-child             
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mayurpandit25/argocd.git
    targetRevision: main
    path: Declarative-approach/tomcat    
  destination:
    server: https://kubernetes.default.svc
    namespace: default          
    automated:
      prune: true
      selfHeal: true
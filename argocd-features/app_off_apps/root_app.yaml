apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app               
  namespace: argocd             
spec:
  project: default             
  source:
    repoURL: https://github.com/mayurpandit25/argocd.git  
    targetRevision: main       
    path: app_off_apps/apps   
  destination:
    server: https://kubernetes.default.svc 
    namespace: argocd             
  syncPolicy:
    automated:
      prune: true                 
      selfHeal: true              
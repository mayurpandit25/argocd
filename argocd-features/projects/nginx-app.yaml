apiVersion: argoproj.io/v1alpha1 
kind: Application             
metadata:                                            
  name: nginx-frontend      
  namespace: argocd            
spec:
  project: frontend-team       
  source:
    repoURL: https://github.com/mayurpandit25/argocd.git 
    targetRevision: main     
    path: GUI-approach/nginx    
  destination:
    server: https://kubernetes.default.svc
    namespace: frontend         
  syncPolicy:                   
    automated:                   
      prune: true                
      selfHeal: true            
    syncOptions:              
      - CreateNamespace=true     